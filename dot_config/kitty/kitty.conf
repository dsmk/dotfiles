# =====================================================================
# WAYLAND & SWAY INTEGRATION
# =====================================================================
# Force native Wayland backend (avoid XWayland blur/overhead)
linux_display_server wayland

# Let Sway handle window borders; remove Kitty's redundant titlebar
hide_window_decorations yes
window_padding_width 6

# Clean, compact tab bar at the top (only shows when >= 2 tabs exist)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# =====================================================================
# CONTAINER & REMOTE CONTROL SETUP
# =====================================================================
# Prevent missing-terminfo errors inside minimal Alpine/Debian containers
term xterm-256color

# Enable 'kitty @' scripting & built-in session switching
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# =====================================================================
# LAYOUTS & SPLITS (Two-Tier Tiling with Sway)
# =====================================================================
# Enable 'splits' (arbitrary hsplit/vsplit), 'tall' (master-stack), and 'stack' (zoom)
enabled_layouts splits,tall,stack

# Subtle pane borders so you can tell active vs. inactive splits apart
window_border_width 1.5pt
draw_minimal_borders yes
active_border_color #89b4fa
inactive_border_color #45475a
inactive_text_alpha 0.85

# =====================================================================
# KEYBINDINGS (Vim-Style Pane Navigation & Splits)
# =====================================================================
# Use Ctrl+Shift as your Kitty leader so Alt/Super stay free for Sway
kitty_mod ctrl+shift

# Create horizontal & vertical splits inheriting current working directory
map kitty_mod+\ launch --location=vsplit --cwd=current
map kitty_mod+- launch --location=hsplit --cwd=current

# Navigate splits with Vim directions (Ctrl+Shift + H/J/K/L)
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right

# Move/swap splits around
map kitty_mod+alt+h move_window left
map kitty_mod+alt+j move_window down
map kitty_mod+alt+k move_window up
map kitty_mod+alt+l move_window right

# Toggle zoom on active pane ('stack' layout) & cycle layouts
map kitty_mod+z toggle_layout stack
map kitty_mod+space next_layout

# Built-in interactive session switcher & saver
map kitty_mod+s goto_session ~/.config/kitty/sessions
map kitty_mod+alt+s save_as_session --base-dir ~/.config/kitty/sessions

# =====================================================================
# FONT & PERFORMANCE
# =====================================================================
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Responsive input latency & visual bell (no audio beep)
input_delay 2
repaint_delay 8
enable_audio_bell no
visual_bell_duration 0.1

